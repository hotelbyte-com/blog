---

<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/minima.css">
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="header-wrapper">
        <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
          <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="HotelByte Blog" width="160" height="40">
        </a>
      </div>
    </header>

    <main class="home-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p>© {{ site.time | date: "%Y" }} {{ site.title | escape }}. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
