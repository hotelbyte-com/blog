<div class="language-switcher">
  <select id="language-select" onchange="switchLanguage(this.value)">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
</div>

<script>
  function switchLanguage(lang) {
    const currentPath = window.location.pathname;
    
    // Store user's language preference
    sessionStorage.setItem('lang-selected', 'true');
    
    // Check current language
    const isZh = currentPath.startsWith('/zh/') || currentPath === '/';
    const isEn = currentPath.startsWith('/en/');
    
    // Get path without language prefix
    let pathWithoutLang = currentPath;
    if (isZh && currentPath !== '/') {
      pathWithoutLang = currentPath.substring(3);
    } else if (isEn) {
      pathWithoutLang = currentPath.substring(3);
    } else if (currentPath === '/') {
      pathWithoutLang = '/';
    }
    
    // Build new path
    let newPath;
    if (lang === 'en') {
      newPath = '/en' + (pathWithoutLang === '/' ? '/' : pathWithoutLang);
    } else {
      newPath = (pathWithoutLang === '/' ? '/' : pathWithoutLang);
    }
    
    window.location.href = newPath;
  }

  // Set current language in select
  document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    let currentLang = 'zh';
    
    if (currentPath.startsWith('/en/')) {
      currentLang = 'en';
    } else if (currentPath.startsWith('/zh/')) {
      currentLang = 'zh';
    }
    
    document.getElementById('language-select').value = currentLang;
  });
</script>
