<div class="language-switcher">
  <select id="language-select" onchange="switchLanguage(this.value)">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
</div>

<script>
  function switchLanguage(lang) {
    const currentPath = window.location.pathname;
    
    // Check current language
    const isZh = currentPath.startsWith('/zh/');
    const isEn = currentPath.startsWith('/en/');
    
    // Get path without language prefix
    let pathWithoutLang = currentPath;
    if (isZh) {
      pathWithoutLang = currentPath.substring(3);
    } else if (isEn) {
      pathWithoutLang = currentPath.substring(3);
    }
    
    // Build new path
    const newPath = `/${lang}${pathWithoutLang}`;
    window.location.href = newPath;
  }

  // Auto-detect browser language and set current selection
  document.addEventListener('DOMContentLoaded', function() {
    const browserLang = navigator.language || navigator.userLanguage;
    const preferredLang = browserLang.startsWith('zh') ? 'zh' : 'en';
    
    const currentPath = window.location.pathname;
    const hasLangPrefix = currentPath.startsWith('/en/') || currentPath.startsWith('/zh/');
    
    // Set current language in select
    const currentLang = currentPath.startsWith('/en/') ? 'en' : 'zh';
    document.getElementById('language-select').value = currentLang;
    
    // Store selection
    document.getElementById('language-select').addEventListener('change', function() {
      sessionStorage.setItem('lang-selected', 'true');
    });
  });
</script>
