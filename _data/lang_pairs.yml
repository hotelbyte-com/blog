# Authoritative zh ↔ en URL pair table.
#
# Each entry declares the canonical path in each language for one logical page.
# The language switcher consults this table before falling back to
# `replace_first('/zh/', '/en/')`. If a path is listed here as a single entry
# (i.e. both `zh` and `en` point at the same path), the page is language-neutral
# and the switcher hides itself.
#
# Keep in sync with:
#   - _data/ai_geo.yml  (priority_routes)
#   - ai-geo-head.html  (alternate hreflang emissions)
#   - test/seo_geo_test.rb
#   - llms.txt          (does not depend on this file)

home:
  zh: /
  en: /en/

whitepaper_index:
  zh: /zh/whitepapers/
  en: /en/whitepapers/

series_index:
  zh: /zh/series/
  en: /en/series/

archive:
  zh: /zh/archive/
  en: /en/archive/

topic_hotel_api_integration:
  zh: /zh/topics/hotel-api-integration/
  en: /en/topics/hotel-api-integration/

topic_openapi_hotel_distribution:
  zh: /zh/topics/openapi-hotel-distribution/
  en: /en/topics/openapi-hotel-distribution/

notice_platform_rights:
  zh: /zh/notices/hotelbyte-platform-ip-rights-ttdbooking/
  en: /en/notices/hotelbyte-platform-ip-rights-ttdbooking/

# Whitepaper guide / original posts. Each post has both a guide (intro) and
# original (full whitepaper) URL pair. Listing them explicitly keeps the
# language switcher deterministic and bypasses the category-segment race in
# `replace_first` when both languages share the same slug.
