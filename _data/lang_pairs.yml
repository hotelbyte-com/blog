  - wp06-supplier-adapter-framework
  - wp07-supplier-resilience
  - wp08-supplier-session-booking
  - wp09-supplier-credential-security
  - wp10-price-normalization
  - wp11-real-time-search
  - wp12-sse-streaming-search
  - wp13-order-lifecycle
  - wp14-wallet-credit
  - wp15-pricing-rules
  - wp16-room-mapping-shadow
  - wp17-llm-intelligence
  - wp18-time-series-bi
  - wp19-price-intelligence
  - wp20-content-distribution
  - wp21-geographic-search
  - wp22-spec-driven-development
  - wp23-real-data-testing
  - wp24-observability
  - wp25-zero-downtime
  - wp26-data-agent-operational-intelligence
  - wp27-ai-native-engineering-operating-system

# Pages without an English counterpart. The switcher hides itself on these
# paths. Add paths here when an EN version is intentionally absent.
no_english_counterpart:
  - /about/
  - /404.html
  - /en/404.html