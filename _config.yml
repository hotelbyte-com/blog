# Site settings
title: HotelByte Blog
email: developers@hotelbyte.com
description: "Technical articles about hotel API distribution, Go microservices, and building scalable travel tech platforms"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://blog.hotelbyte.com" # the base hostname & protocol for your site

# Social
github_username: hotelbyte-com
twitter_username: hotelbyte_dev
linkedin_username: hotelbyte

# Build settings
markdown: kramdown
theme: minima
highlighter: rouge
permalink: /:categories/:title/
future: true  # Show future posts for testing

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-polyglot

# I18n
languages: ["zh", "en"]
default_lang: "zh"
parallel_localization: false
exclude_from_localization:
  - assets
  - CNAME
  - _layouts
  - _includes

# URL structure
permalink: /:categories/:title/

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - assets/css/_main.scss
  - assets/css/main.scss
  - _sass/
  - LICENSE
  - README.md

# Custom CSS
sass:
  style: compressed

# Google Analytics
google_analytics: G-1ZJN193FS9

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "HotelByte Team"
  - scope:
      path: "assets/img"
    values:
      image: true

# URL structure
permalink: /:categories/:title/
